<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlendModeTester2025-Revision</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header-as-topbar">
      <h1 class="h1-as-title">blend mode tester</h1>
      <button class="button-as-toggler">choose mode</button>
      <button class="button-as-filter">greyscale images</button>
      <button class="button-as-closer">close panels</button>
    </header>

    <div class="div-as-shell">
      <form action="" class="form-as-controls">
        <ul class="ul-as-options">
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Normal</span>
              <input
                type="radio"
                name="blendmode"
                id="normal"
                value="normal"
                checked
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Multiply</span>
              <input
                type="radio"
                name="blendmode"
                id="multiply"
                value="multiply"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Color</span>
              <input type="radio" name="blendmode" id="color" value="color" />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Screen</span>
              <input type="radio" name="blendmode" id="screen" value="screen" />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Overlay</span>
              <input
                type="radio"
                name="blendmode"
                id="overlay"
                value="overlay"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Darken</span>
              <input type="radio" name="blendmode" id="darken" value="darken" />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Lighten</span>
              <input
                type="radio"
                name="blendmode"
                id="lighten"
                value="lighten"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Color-Dodge</span>
              <input
                type="radio"
                name="blendmode"
                id="color-dodge"
                value="color-dodge"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Color-Burn</span>
              <input
                type="radio"
                name="blendmode"
                id="color-burn"
                value="color-burn"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Soft-Light</span>
              <input
                type="radio"
                name="blendmode"
                id="soft-light"
                value="soft-light"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Hard-Light</span>
              <input
                type="radio"
                name="blendmode"
                id="hard-light"
                value="hard-light"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Exclusion</span>
              <input
                type="radio"
                name="blendmode"
                id="exclusion"
                value="exclusion"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Saturation</span>
              <input
                type="radio"
                name="blendmode"
                id="saturation"
                value="saturation"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
          <li class="li-as-option">
            <label>
              <span class="span-as-label">Luminosity</span>
              <input
                type="radio"
                name="blendmode"
                id="luminosity"
                value="luminosity"
              />
              <span class="span-as-indicator"></span>
            </label>
          </li>
        </ul>

        <label class="label-as-customizer">
          <div class="div-as-heading">Choose Custom Color.</div>
          <input type="color" id="color-picker" class="input-as-chooser" />
        </label>
