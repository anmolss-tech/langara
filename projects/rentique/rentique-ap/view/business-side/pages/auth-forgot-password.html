<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentique - Forgot Password</title>
  <meta name="theme-color" content="#06324f">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logos/rentique-sub.png">
  <link rel="stylesheet" href="../css/auth-common.css">
  <link rel="stylesheet" href="../css/auth-password.css">
  <link rel="stylesheet" href="/view/components/css/modal.css" />
  <script src="../../../controller/components/modal.js" type = "module" defer></script>
  <script src="../../../controller/business-side/auth-forgot-password.js" type="module" defer></script>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo-section">
        <a href="/auth-home.html" class="back-arrow"></a>
        <img src="/assets/logos/rentique-main.png" alt="Rentique logo" class="logo">
        <!-- <h1>RENTIQUE</h1> -->
      </div>

      <form class="login-form" id="forgotPasswordForm">
        <h2>PASSWORD RESET</h2>
        
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
          <span class="error-message" id="emailError"></span>
        </div>

        <button type="submit" class="login-btn">SEND RESET REQUEST</button>

        <p class="signup-text">
          Return to <a href="auth-login-business.html">Log In</a>
        </p>
      </form>
    </div>

    <div class="right">
      <img src="https://rxt7sochug9y6jiw.public.blob.vercel-storage.com/home.png" alt="Fashion Model" class="hero-img">
    </div>
  </div>
 
  <div id="modalContainer" class="modal-container">
    <div class="modal-box">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalMessage" class="modal-message"></p>
        <div id="modalInputContainer" class="modal-input-container">
            <input type="password" id="modalInput" class="modal-input">
        </div>
        <div id="modalButtonContainer" class="modal-button-container">
        </div>
    </div>
  </div>
</body>
</html>
