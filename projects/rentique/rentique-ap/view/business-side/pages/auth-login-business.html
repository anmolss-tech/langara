<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentique - Business Login</title>
  <meta name="theme-color" content="#06324f">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logos/rentique-sub.png">
  <link rel="stylesheet" href="../css/auth-common.css">
  <link rel="stylesheet" href="../css/auth-login.css">
  <link rel="stylesheet" href="../../components/css/var.css" />
  <link rel="stylesheet" href="/view/components/css/modal.css" />
  <script src="../../../controller/components/modal.js" type="module" defer></script>
  <script src="../../../controller/business-side/auth-login.js" type="module" defer></script>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo-section">
        <a href="/auth-home.html" class="back-arrow"></a>
        <img src="/assets/logos/rentique-main.png" alt="Rentique logo" class="logo">
        <!-- <h1>RENTIQUE</h1> -->
      </div>

      <form class="login-form" id="loginForm">
        <h2>LOG IN</h2>
        
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <input type="password" id="password" placeholder="Password" required>
          <span class="error-message" id="passwordError"></span>
        </div>

        <div style="margin-top: -10px;">
          <span class="forgot">Forgot your password?</span>
          <a href="auth-forgot-password.html" class="forgot forgot-reset">Reset Password</a>
        </div>

        <button type="submit" class="login-btn">LOG IN</button>

        <p class="signup-text">
          Don't have an account? <a href="auth-signup-business.html">Sign Up</a>
        </p>

        <p class="customer-link">
          Sign in as <a href="auth-login-customer.html">Customer</a>
        </p>
      </form>
    </div>

    <div class="right">
      <img src="https://rxt7sochug9y6jiw.public.blob.vercel-storage.com/home.png" alt="Fashion Model" class="hero-img">
    </div>
  </div>

  <div id="modalContainer"> </div>
</body>
</html>
